name: CI

on:
  push:
    branches:
      - "**"

jobs:
  check:
    runs-on: docker
    container:
      # Keep in sync with .nvmrc.
      image: node:24
    steps:
      - name: Checkout
        run: |
          SERVER=$(echo "${{ github.server_url }}" | sed 's|https\?://||')
          git clone --depth 1 --branch "${{ github.ref_name }}" \
            "https://x-token:${{ secrets.GITHUB_TOKEN }}@$SERVER/${{ github.repository }}.git" .

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Docs samples
        run: npm run docs:check

  container:
    runs-on: docker
    container:
      image: docker:27-cli
    services:
      dind:
        image: docker:27-dind
        env:
          DOCKER_TLS_CERTDIR: ""
        options: --privileged
    steps:
      - name: Checkout
        run: |
          apk add --no-cache git
          SERVER=$(echo "${{ github.server_url }}" | sed 's|https\?://||')
          git clone --depth 1 --branch "${{ github.ref_name }}" \
            "https://x-token:${{ secrets.GITHUB_TOKEN }}@$SERVER/${{ github.repository }}.git" .

      - name: Wait for Docker daemon
        run: until docker info >/dev/null 2>&1; do sleep 1; done

      - name: Container smoke test
        run: sh scripts/container-smoke.sh

  e2e:
    runs-on: docker
    container:
      image: docker:27-cli
    services:
      dind:
        image: docker:27-dind
        env:
          DOCKER_TLS_CERTDIR: ""
        options: --privileged
    steps:
      - name: Checkout
        run: |
          apk add --no-cache git
          SERVER=$(echo "${{ github.server_url }}" | sed 's|https\?://||')
          git clone --depth 1 --branch "${{ github.ref_name }}" \
            "https://x-token:${{ secrets.GITHUB_TOKEN }}@$SERVER/${{ github.repository }}.git" .

      - name: Wait for Docker daemon
        run: until docker info >/dev/null 2>&1; do sleep 1; done

      - name: End-to-end test against Home Assistant
        run: sh scripts/e2e-ha.sh
