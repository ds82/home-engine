name: Release image

# Tags vX.Y.Z build and push the multi-arch image (linux/amd64, linux/arm64) as X.Y.Z, X.Y, X
# and latest; pre-releases (vX.Y.Z-rc.1) only as their own version. Branch pushes that touch
# the image build it as a dry run (both platforms, size budget), pushing nothing.
#
# The image goes to ghcr.io/<owner>/<repo> with the workflow's token, unless the repository
# variable IMAGE names another one; then the secret REGISTRY_TOKEN is used to log in.

on:
  push:
    tags:
      - "v*"
    branches:
      - "**"
    paths:
      - "docker/**"
      - "scripts/build-image.sh"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Dry run (both platforms, size budget)
        if: github.ref_type != 'tag'
        run: sh scripts/build-image.sh --dry-run

      - name: Compute image and tags
        if: github.ref_type == 'tag'
        id: meta
        run: |
          IMAGE="${{ vars.IMAGE }}"
          [ -n "$IMAGE" ] || IMAGE="ghcr.io/${{ github.repository }}"
          IMAGE=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          case "$VERSION" in
            *-*) TAGS="$VERSION" ;;
            *)
              MINOR="${VERSION%.*}"
              MAJOR="${VERSION%%.*}"
              TAGS="$VERSION $MINOR $MAJOR latest"
              ;;
          esac
          echo "image=$IMAGE" >> $GITHUB_OUTPUT
          echo "registry=${IMAGE%%/*}" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tags=$TAGS" >> $GITHUB_OUTPUT

      - name: Log in to registry
        if: github.ref_type == 'tag'
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TOKEN="$REGISTRY_TOKEN"
          [ -n "$TOKEN" ] || TOKEN="$GITHUB_TOKEN"
          echo "$TOKEN" | docker login "${{ steps.meta.outputs.registry }}" \
            --username "${{ github.actor }}" --password-stdin

      - name: Build, push and check the size budget
        if: github.ref_type == 'tag'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: sh scripts/build-image.sh --push "${{ steps.meta.outputs.image }}" ${{ steps.meta.outputs.tags }}
